name: Keep Streamlit Awake

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Wake up Streamlit app
        run: |
          curl --max-time 60 --retry 3 --retry-delay 10 \
          -A "Mozilla/5.0" \
          https://abpranking.streamlit.app/ || true
